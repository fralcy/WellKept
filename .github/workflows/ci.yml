name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed and tested with —
          # bump deliberately, together with a local `flutter upgrade`.
          flutter-version: 3.41.7
          cache: true

      # Also generates the l10n code (pubspec: flutter: generate: true).
      - run: flutter pub get

      # Hive adapters (*.g.dart) are generated, not committed.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test

  # Deploys only from main, and only once the tests above have passed.
  build-web:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      # GitHub Pages serves this repo under /WellKept/.
      - run: flutter build web --release --base-href /WellKept/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
