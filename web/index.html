<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    Replaced by the `--base-href` given to `flutter build web` (CI deploys
    under /WellKept/ on GitHub Pages). Must start and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WellKept — sổ tay bảo trì & bảo hành đồ dùng: nhắc mốc thay dầu, vệ sinh máy lạnh, hết hạn bảo hành.">
  <meta name="theme-color" content="#5B7FDB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WellKept">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WellKept</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #E6EBF2;">
  <!--
    GitHub Pages can't set Cache-Control headers, so a browser may keep
    serving an old main.dart.js after a deploy. Once per page open, fetch the
    tiny flutter_bootstrap.js bypassing the HTTP cache and compare it with
    the copy seen last time (in localStorage); if it changed, this load was
    stale — reload once to pick up the new version. (Same approach as
    DualCal, see its ARCHITECTURE.md §12.)
  -->
  <script>
    (function () {
      var STORAGE_KEY = 'wellkept_bootstrap_fingerprint';
      var checkUrl = new URL('flutter_bootstrap.js', document.baseURI).toString();

      fetch(checkUrl, { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.text() : null; })
        .then(function (fresh) {
          if (fresh == null) return;
          var stored = null;
          try {
            stored = localStorage.getItem(STORAGE_KEY);
          } catch (e) {
            // Private browsing / storage disabled — just skip the check.
            return;
          }
          try {
            localStorage.setItem(STORAGE_KEY, fresh);
          } catch (e) {
            // Ignore — worst case we re-check against the same baseline next time.
          }
          if (stored !== null && stored !== fresh) {
            window.location.reload();
          }
        })
        .catch(function () {
          // Offline, or the request was blocked — just try again next open.
        });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
